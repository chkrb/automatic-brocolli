<!DOCTYPE html>
<html>
  <head>
    <title> PQ POS Web Configuration </title>
  </head>

  <body>
    <form action="reset" method="post" onsubmit="return resetCall(this)">
      <label for="wifi_ssid"> Wi-Fi SSID </label> <br/>
      <input type="text" name="wifi_ssid" id="wifi_ssid" value="%s" minlength="1" maxlength="32" required /> <br/>

      <label for="wifi_psk"> Wi-Fi Password </label> <br/>
      <input type="password" name="wifi_psk" id="wifi_psk" value="%s" minlength="8" maxlength="63" /> <br/>

      <label for="ip"> Server IP </label> <br/>
      <input type="text" name="server_ip" id="server_ip" value="%s" pattern="^(((?!25?[6-9])[12]\d|[1-9])?\d\.?\b){4}$" /> <br/>

      <input type="submit" value="Apply" />
    </form>

    <script>
      function resetCall(form) {
        event.preventDefault();
        fetch(
          form.action,
          {
            method: form.method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.fromEntries(new FormData(form)))
          }
        )

        return false;
      }
    </script>
  </body>
</html>
