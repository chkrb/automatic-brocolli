[versions]
lib-androidx-activity-compose = "1.13.0"
lib-androidx-camera = "1.7.0-alpha03"
lib-androidx-compose-bom = "2026.06.01"
lib-androidx-glance = "1.1.1"
lib-androidx-navigation-compose = "2.9.8"
lib-mlkit-barcode = "17.3.0"
lib-kotlin-serialization-json = "1.11.0"
lib-zxing = "3.5.4"
plug-android-application = "9.2.1"
plug-kotlin-compose = "2.4.0"
plug-kotlin-serialization = "2.4.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "lib-androidx-activity-compose" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "lib-androidx-camera" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "lib-androidx-camera" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "lib-androidx-camera" }
androidx-camera-view = {group = "androidx.camera", name = "camera-view", version.ref = "lib-androidx-camera" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "lib-androidx-compose-bom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "lib-androidx-navigation-compose" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "lib-kotlin-serialization-json" }
mlkit-barcode = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "lib-mlkit-barcode" }
zxing = { group = "com.google.zxing", name = "core", version.ref = "lib-zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "plug-android-application" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "plug-kotlin-compose" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "plug-kotlin-serialization" }
